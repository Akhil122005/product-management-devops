services:


  mysql:

    image: mysql:8

    container_name: product-management-mysql


    environment:

      MYSQL_ROOT_PASSWORD: Akhil@2005

      MYSQL_DATABASE: testdb


    ports:

      - "3306:3306"


    volumes:

      - mysql_data:/var/lib/mysql


    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]

      interval: 10s

      timeout: 5s

      retries: 10


  backend:

    image: akhil122005/product-management-backend:${BUILD_NUMBER}

    container_name: product-management-backend


    build:

      context: ./backend


    ports:

      - "8081:8080"


    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/testdb

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: Akhil@2005

      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_JPA_SHOW_SQL: "true"


    depends_on:

      mysql:

        condition: service_healthy


  frontend:

    image: akhil122005/product-management-frontend:${BUILD_NUMBER}

    container_name: product-management-frontend


    build:

      context: ./frontend


    ports:

      - "3000:80"


    depends_on:

      - backend


volumes:

  mysql_data:
