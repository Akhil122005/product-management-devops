services:


  mysql:

    image: mysql:8

    container_name: product-management-mysql


    environment:

      MYSQL_ROOT_PASSWORD: Akhil@2005

      MYSQL_DATABASE: testdb


    ports:

      - "3306:3306"


    volumes:

      - mysql_data:/var/lib/mysql


    healthcheck:

      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]

      interval: 10s

      timeout: 5s

      retries: 10


  backend:

    image: product-management-backend:latest

    container_name: product-management-backend


    build:

      context: ./backend


    ports:

      - "8081:8081"


    depends_on:

      mysql:

        condition: service_healthy


  frontend:

    image: product-management-frontend:latest

    container_name: product-management-frontend


    build:

      context: ./frontend


    ports:

      - "3000:80"


    depends_on:

      - backend


volumes:

  mysql_data:
